version: 2

models:
  - name: stg_customers
    columns:
      - name: customer_key
        tests: [unique, not_null]
  - name: stg_products
    columns:
      - name: product_key
        tests: [unique, not_null]
  - name: stg_orders
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_key
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_key
  - name: stg_order_items
    columns:
      - name: product_key
        tests:
          - not_null
          - relationships:
              to: ref('stg_products')
              field: product_key
      - name: order_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_orders')
              field: order_id
      - name: quantity
        tests: [not_null]
